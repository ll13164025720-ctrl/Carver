AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SiteRevive MVP API - Bedrock website blueprint generation

Globals:
  Function:
    Runtime: nodejs22.x
    # Bedrock website generation takes 50-120 s (see GENERATE_TIMEOUT_MS in the
    # frontend). Note: a deployed HTTP API gateway caps requests at 30 s, so this
    # long timeout only helps `sam local`.
    Timeout: 300
    MemorySize: 1024
    Architectures:
      - arm64

Resources:
  SiteReviveHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  SiteReviveApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: apps/backend/src/handler.handler

      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          VERSIONS_TABLE: !Ref BlueprintVersionsTable
          ASSETS_BUCKET: !Ref SiteReviveAssetsBucket
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-5

          # SAM local: access the Playwright worker on the host Mac.
          CAPTURE_WORKER_URL: http://host.docker.internal:3002/capture
          CAPTURE_WORKER_PUBLIC_URL: http://localhost:3002
          # Base for published site links. Empty = derive from the request host.
          # Set to http://localhost:3001 in env.json for `sam local`.
          PUBLIC_SITES_BASE_URL: ""
          # No auth yet: the deployed API serves only /sites/* and /health.
          # env.json sets "false" so `sam local` keeps the full API.
          PUBLIC_SITES_ONLY: "true"

      Policies:
        # Only the DynamoDB operations required by the backend.
        - Statement:
            - Sid: ProjectsTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ProjectsTable.Arn

            - Sid: BlueprintVersionsTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt BlueprintVersionsTable.Arn

            # The backend can only read and write objects
            # under the projects/ prefix in its private bucket.
            - Sid: ProjectAssetsAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${SiteReviveAssetsBucket.Arn}/projects/*"

            # Hackathon MVP: inference profile may route to
            # approved foundation models in multiple US regions.
            # Narrow this permission before production.
            - Sid: BedrockInvocation
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"

      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /health
            Method: GET

        CaptureWebsite:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/captures
            Method: POST

        EditBlueprint:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/blueprints/edit
            Method: POST

        GenerateBlueprint:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/blueprints/generate
            Method: POST

        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}
            Method: GET

        ListProjectVersions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}/versions
            Method: GET

        GetProjectVersion:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}/versions/{versionNumber}
            Method: GET

        PublishProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}/publish
            Method: POST

        UnpublishProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}/unpublish
            Method: POST

        ExportProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /api/projects/{projectId}/export
            Method: GET

        PublishedSite:
          Type: HttpApi
          Properties:
            ApiId: !Ref SiteReviveHttpApi
            Path: /sites/{projectId}
            Method: GET

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - apps/backend/src/handler.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Format: cjs

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  BlueprintVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: versionId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: versionId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  SiteReviveAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # All four public-access protections remain enabled.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # Explicitly configure encryption at rest using SSE-S3.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  SiteReviveApiUrl:
    Description: SiteRevive HTTP API endpoint
    Value: !Sub "https://${SiteReviveHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
